<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WB Sync — Дашборд</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/themes.css?v=3">
<link rel="stylesheet" href="/static/base.css?v=3">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="/static/js/core.js?v=3"></script>
</head>
<body>

<!-- ============ ШАПКА ============ -->
<header class="header">
  <div class="header-left">
    <div class="logo">WB SYNC <span>/ DASHBOARD</span></div>
  </div>

  <div class="header-center">
    <!-- Глобальный фильтр кабинета -->
    <div class="global-cab-wrap">
      <span class="global-cab-label">Кабинет</span>
      <select class="filter-select global-cab-select" onchange="setCabinet(this.value)">
        <option value="">Все</option>
      </select>
    </div>

    <!-- Период -->
    <div class="period-selector">
      <button class="period-btn" onclick="setPeriod(7, this)">7Д</button>
      <button class="period-btn" onclick="setPeriod(14, this)">14Д</button>
      <button class="period-btn" onclick="setPeriod(30, this)">30Д</button>
      <button class="period-btn active" onclick="setPeriod(40, this)">40Д</button>
    </div>
  </div>

  <div class="header-right">
    <!-- Выбор темы -->
    <div class="theme-selector">
      <div class="theme-dot active" data-t="dark"     title="Dark"     onclick="applyTheme('dark')"></div>
      <div class="theme-dot"        data-t="midnight" title="Midnight"  onclick="applyTheme('midnight')"></div>
      <div class="theme-dot"        data-t="light"    title="Light"     onclick="applyTheme('light')"></div>
    </div>

    <button class="sync-btn" onclick="triggerSync()">⟳ СИНХР</button>
    <div class="last-sync" id="lastSync">—</div>

    <div class="user-info" id="userInfo" style="display:none">
      <span class="user-name" id="userName"></span>
      <a href="/logout" class="logout-btn" title="Выйти">⏻</a>
    </div>
  </div>
</header>

<!-- ============ НАВИГАЦИЯ ТАБОВ ============ -->
<nav class="tabs-nav">
  <div class="tabs-row">
    <span class="tabs-label">Аналитика</span>
    <button class="tab-btn" data-tab="summary"  onclick="switchTab('summary')">📊 Сводка</button>
    <button class="tab-btn" data-tab="rnp" onclick="switchTab('rnp')">🎯 РНП</button>
    <button class="tab-btn" data-tab="abcxyz"   onclick="switchTab('abcxyz')">📐 ABC/XYZ</button>
    <button class="tab-btn" data-tab="shelf"    onclick="switchTab('shelf')">🏪 Витрина</button>
    <button class="tab-btn" data-tab="funnel"   onclick="switchTab('funnel')">🔄 Конверсия</button>
    <button class="tab-btn" data-tab="stock-forecast" onclick="switchTab('stock-forecast')">📉 Прогноз</button>
    <button class="tab-btn" data-tab="unit-economics" onclick="switchTab('unit-economics')">💰 Юнит-экономика</button>
    <button class="tab-btn" data-tab="search-clusters" onclick="switchTab('search-clusters')">🔍 Поиск</button>
  </div>
  <div class="tabs-row">
    <span class="tabs-label">Данные</span>
    <button class="tab-btn" data-tab="orders"   onclick="switchTab('orders')">🛒 Заказы</button>
    <button class="tab-btn" data-tab="stocks"   onclick="switchTab('stocks')">📦 Остатки</button>
    <button class="tab-btn" data-tab="top"      onclick="switchTab('top')">🏆 Топ товаров</button>
    <button class="tab-btn" data-tab="report"   onclick="switchTab('report')">💰 Отчёт реализации</button>
    <button class="tab-btn" data-tab="stock-offices" onclick="switchTab('stock-offices')">🏭 Склады</button>
    <button class="tab-btn" data-tab="item-ratings"  onclick="switchTab('item-ratings')">⭐ Оценки</button>
    <button class="tab-btn" data-tab="ad"    onclick="switchTab('ad')">📢 Реклама</button>
    <button class="tab-btn" data-tab="chars"    onclick="switchTab('chars')">📋 Характеристики</button>
    <button class="tab-btn" data-tab="profile" onclick="switchTab('profile')">👤 Профиль</button>
    <button class="tab-btn" data-tab="admin" onclick="switchTab('admin')" id="adminTab" style="display:none">⚙ Управление</button>
  </div>
</nav>

<!-- ============ КОНТЕНТ ТАБОВ ============ -->
<div class="main">
  <div id="tab-summary" class="tab-content"></div>
  <div id="tab-orders"  class="tab-content"></div>
  <div id="tab-stocks"  class="tab-content"></div>
  <div id="tab-top"     class="tab-content"></div>
  <div id="tab-report"  class="tab-content"></div>
  <div id="tab-shelf"   class="tab-content"></div>
  <div id="tab-funnel"  class="tab-content"></div>
  <div id="tab-stock-offices" class="tab-content"></div>
  <div id="tab-item-ratings"  class="tab-content"></div>
  <div id="tab-ad"    class="tab-content"></div>
  <div id="tab-chars"   class="tab-content"></div>
  <div id="tab-abcxyz"  class="tab-content"></div>
  <div id="tab-stock-forecast" class="tab-content"></div>
  <div id="tab-unit-economics" class="tab-content"></div>
  <div id="tab-search-clusters" class="tab-content"></div>
  <div id="tab-rnp" class="tab-content"></div>
  <div id="tab-profile" class="tab-content"></div>
  <div id="tab-admin" class="tab-content"></div>
</div>

<script src="/static/js/tabs.js?v=3"></script>
<script>
  document.addEventListener('DOMContentLoaded', loadLastSync);

  fetch('/api/auth/me').then(r => r.json()).then(user => {
    if (user.id) {
      document.getElementById('userInfo').style.display = 'flex';
      document.getElementById('userName').textContent = user.full_name || user.username;
      if (user.is_admin) {
        document.getElementById('adminTab').style.display = '';
      }
      window.WB.user = user;
    }
  }).catch(() => {});

  window.logout = function() { window.location.href = '/logout'; };
</script>
<style>
.user-info {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: 8px;
}
.user-name {
  font-size: 12px;
  color: var(--text2);
  font-family: 'IBM Plex Mono', monospace;
}
.logout-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  background: rgba(255,71,87,0.12);
  color: #ff4757;
  text-decoration: none;
  font-size: 14px;
  transition: background 0.2s;
}
.logout-btn:hover { background: rgba(255,71,87,0.25); }
</style>
</body>
</html>
