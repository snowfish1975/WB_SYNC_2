<!-- ============================================================
     TAB: ПОИСКОВЫЕ КЛАСТЕРЫ
     ============================================================ -->
<div id="searchClustersTab">
  <div class="summary-grid section-mb" id="scMetrics"></div>

  <div class="card">
    <div class="section-title">Поисковые кластеры рекламных кампаний</div>
    <div class="filters">
      <input class="filter-input" id="scSearch" placeholder="Запрос / кампания..." oninput="scFilter()">
      <select class="filter-select" id="scSortBy" onchange="scFilter()">
        <option value="spend">По затратам</option>
        <option value="orders">По заказам</option>
        <option value="ctr">По CTR</option>
        <option value="cpc">По CPC</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th onclick="scSort('seller_name')">КАБИНЕТ ↕</th>
          <th onclick="scSort('advert_id')">КАМПАНИЯ ↕</th>
          <th onclick="scSort('keyword')">ЗАПРОС ↕</th>
          <th onclick="scSort('views')">ПОКАЗЫ ↕</th>
          <th onclick="scSort('clicks')">КЛИКИ ↕</th>
          <th onclick="scSort('ctr')">CTR % ↕</th>
          <th onclick="scSort('cpc')">CPC ₽ ↕</th>
          <th onclick="scSort('orders')">ЗАКАЗЫ ↕</th>
          <th onclick="scSort('sum_price')">СУММА ₽ ↕</th>
          <th onclick="scSort('spend')">ЗАТРАТЫ ₽ ↕</th>
        </tr></thead>
        <tbody id="scBody"></tbody>
      </table>
    </div>
    <div class="pagination" id="scPagination"></div>
  </div>
</div>

<script>
(function() {
  let data = [], filtered = [], page = 1;
  const PER = 50;
  let sortCol = 'spend', sortDir = -1;

  async function scLoad() {
    document.getElementById('scBody').innerHTML = '';
    try {
      const res = await fetch('/api/dashboard/ad-search-clusters');
      data = await res.json();
    } catch(e) { data = []; }
    scFilter();
    renderMetrics();
  }
  window.scLoad = scLoad;

  function scFilter() {
    const search = (document.getElementById('scSearch')?.value || '').toLowerCase();
    filtered = data.filter(r => {
      if (WB.cabinet && r.cabinet_id !== WB.cabinet) return false;
      if (search && !`${r.keyword||''}`.toLowerCase().includes(search) && !`${r.advert_id}`.includes(search)) return false;
      return true;
    });
    sortData();
  }
  window.scFilter = scFilter;

  function scSort(col) {
    if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = -1; }
    sortData();
  }
  window.scSort = scSort;

  function sortData() {
    filtered.sort((a, b) => {
      let va = a[sortCol], vb = b[sortCol];
      if (va == null) va = 0; if (vb == null) vb = 0;
      if (typeof va === 'string') return va.localeCompare(vb) * sortDir;
      return (va - vb) * sortDir;
    });
    page = 1;
    render();
  }

  function renderMetrics() {
    const m = document.getElementById('scMetrics');
    if (!m) return;
    const d = WB.cabinet ? data.filter(r => r.cabinet_id === WB.cabinet) : data;
    const totalSpend = d.reduce((s, r) => s + r.spend, 0);
    const totalOrders = d.reduce((s, r) => s + r.orders, 0);
    const totalViews = d.reduce((s, r) => s + r.views, 0);
    const totalClicks = d.reduce((s, r) => s + r.clicks, 0);
    const avgCTR = totalViews > 0 ? (totalClicks / totalViews * 100).toFixed(2) : 0;
    const avgCPC = totalClicks > 0 ? (totalSpend / totalClicks).toFixed(2) : 0;
    const uniqueKeywords = new Set(d.map(r => r.keyword)).size;
    m.innerHTML = `
      <div class="card metric-card teal"><div class="metric-label">ЗАПРОСОВ</div><div class="metric-value">${uniqueKeywords}</div></div>
      <div class="card metric-card orange"><div class="metric-label">ЗАТРАТЫ</div><div class="metric-value">${fmtMoney(Math.round(totalSpend))}</div></div>
      <div class="card metric-card"><div class="metric-label">CTR</div><div class="metric-value">${avgCTR}%</div></div>
      <div class="card metric-card"><div class="metric-label">CPC</div><div class="metric-value">${fmtMoney(Math.round(avgCPC))}</div></div>
      <div class="card metric-card green"><div class="metric-label">ЗАКАЗЫ</div><div class="metric-value">${fmt(totalOrders)}</div></div>
    `;
  }

  function render() {
    const body = document.getElementById('scBody');
    if (!body) return;
    const slice = filtered.slice((page-1)*PER, page*PER);
    if (!filtered.length) {
      body.innerHTML = `<tr><td colspan="10" style="text-align:center;color:var(--text3);padding:30px;">Нет данных. Поисковые кластеры загружаются при синхронизации рекламных кампаний.</td></tr>`;
      document.getElementById('scPagination').innerHTML = '';
      return;
    }
    body.innerHTML = slice.map(r => `<tr class="fade-in">
      <td><span class="badge badge-orange">${r.seller_name || '—'}</span></td>
      <td class="td-mono">${r.advert_id}</td>
      <td>${r.keyword || '—'}</td>
      <td class="td-mono">${fmt(r.views)}</td>
      <td class="td-mono">${fmt(r.clicks)}</td>
      <td class="td-mono" style="color:var(--accent2)">${r.ctr}%</td>
      <td class="td-mono">${r.cpc}</td>
      <td class="td-mono" style="color:var(--green)">${fmt(r.orders)}</td>
      <td class="td-mono" style="color:var(--accent)">${fmtMoney(Math.round(r.sum_price))}</td>
      <td class="td-mono" style="color:var(--red)">${fmtMoney(Math.round(r.spend))}</td>
    </tr>`).join('');
    renderPagination('scPagination', filtered.length, PER, page, p => { page = p; render(); });
  }

  window.addEventListener('wb:tab-activated:search-clusters', scLoad);
  window.addEventListener('wb:cabinet-changed', () => { if (data.length) { scFilter(); renderMetrics(); } });
})();
</script>
