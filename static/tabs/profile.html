<!-- ============================================================
     TAB: ПРОФИЛЬ ПОЛЬЗОВАТЕЛЯ
     ============================================================ -->
<div id="profileTab">
  <div class="two-col section-mb">
    <div class="card">
      <div class="section-title">Мои данные</div>
      <form id="profileForm" class="profile-form" onsubmit="return saveProfile(event)">
        <div class="form-group">
          <label>ФИО</label>
          <input type="text" id="pfFullName" class="filter-input" placeholder="ФИО">
        </div>
        <div class="form-group">
          <label>Компания</label>
          <input type="text" id="pfCompany" class="filter-input" placeholder="Компания">
        </div>
        <div class="form-group">
          <label>Телефон</label>
          <input type="text" id="pfPhone" class="filter-input" placeholder="Телефон">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="text" id="pfEmail" class="filter-input" disabled style="opacity:0.5">
        </div>
        <button type="submit" class="sync-btn" style="background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;">Сохранить</button>
        <span id="pfMsg" style="margin-left:12px;font-size:12px;color:var(--green)"></span>
      </form>
    </div>

    <div class="card">
      <div class="section-title">Смена пароля</div>
      <form id="pwForm" class="profile-form" onsubmit="return changePassword(event)">
        <div class="form-group">
          <label>Текущий пароль</label>
          <input type="password" id="pwCurrent" class="filter-input" required>
        </div>
        <div class="form-group">
          <label>Новый пароль</label>
          <input type="password" id="pwNew" class="filter-input" required minlength="6">
        </div>
        <div class="form-group">
          <label>Повторите новый пароль</label>
          <input type="password" id="pwConfirm" class="filter-input" required>
        </div>
        <button type="submit" class="sync-btn" style="background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;">Сменить пароль</button>
        <span id="pwMsg" style="margin-left:12px;font-size:12px;color:var(--green)"></span>
      </form>
    </div>
  </div>

  <div class="card">
    <div class="section-title">Доступные кабинеты</div>
    <div id="pfCabList" style="padding:16px;color:var(--text2);font-family:'IBM Plex Mono',monospace;font-size:12px;"></div>
  </div>
</div>

<style>
.profile-form { padding: 16px; }
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block;
  font-size: 11px;
  font-family: 'IBM Plex Mono', monospace;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 6px;
}
.form-group input {
  width: 100%;
  padding: 10px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 14px;
  outline: none;
}
.form-group input:focus { border-color: var(--accent); }
.cab-tag {
  display: inline-block;
  padding: 4px 10px;
  background: rgba(68,207,108,0.12);
  color: #44cf6c;
  border-radius: 4px;
  font-size: 12px;
  margin: 3px 4px 3px 0;
}
</style>

<script>
(function() {
  async function loadProfile() {
    const resp = await fetch('/api/auth/me');
    const user = await resp.json();
    if (!user.id) return;
    document.getElementById('pfFullName').value = user.full_name || '';
    document.getElementById('pfCompany').value = user.company || '';
    document.getElementById('pfPhone').value = user.phone || '';
    document.getElementById('pfEmail').value = user.email || '';
  }

  window.saveProfile = async function(e) {
    e.preventDefault();
    const fd = new FormData();
    fd.append('full_name', document.getElementById('pfFullName').value);
    fd.append('company', document.getElementById('pfCompany').value);
    fd.append('phone', document.getElementById('pfPhone').value);
    const resp = await fetch('/api/profile', { method: 'PUT', body: fd });
    const msg = document.getElementById('pfMsg');
    if (resp.ok) { msg.textContent = '✓ Сохранено'; setTimeout(() => msg.textContent = '', 3000); }
    else { msg.style.color = 'var(--red)'; msg.textContent = 'Ошибка'; setTimeout(() => { msg.textContent = ''; msg.style.color = 'var(--green)'; }, 3000); }
  };

  window.changePassword = async function(e) {
    e.preventDefault();
    const pwNew = document.getElementById('pwNew').value;
    const pwConfirm = document.getElementById('pwConfirm').value;
    const msg = document.getElementById('pwMsg');
    if (pwNew !== pwConfirm) { msg.style.color = 'var(--red)'; msg.textContent = 'Пароли не совпадают'; return false; }
    const fd = new FormData();
    fd.append('current_password', document.getElementById('pwCurrent').value);
    fd.append('new_password', pwNew);
    const resp = await fetch('/api/profile/password', { method: 'PUT', body: fd });
    if (resp.ok) { msg.textContent = '✓ Пароль изменён'; document.getElementById('pwForm').reset(); setTimeout(() => msg.textContent = '', 3000); }
    else { const data = await resp.json(); msg.style.color = 'var(--red)'; msg.textContent = data.error || 'Ошибка'; setTimeout(() => { msg.textContent = ''; msg.style.color = 'var(--green)'; }, 3000); }
    return false;
  };

  async function loadCabList() {
    const resp = await fetch('/api/dashboard/cabinets');
    const cabs = await resp.json();
    const el = document.getElementById('pfCabList');
    if (!cabs.length) { el.textContent = 'Нет доступных кабинетов'; return; }
    el.innerHTML = cabs.map(c => `<span class="cab-tag">${c.seller_name}</span>`).join('');
  }

  window.addEventListener('wb:tab-activated:profile', () => { loadProfile(); loadCabList(); });
})();
</script>
