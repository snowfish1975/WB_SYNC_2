<!-- ============================================================
     TAB: ОТЧЁТ РЕАЛИЗАЦИИ
     ============================================================ -->
<div id="reportTab">
  <!-- Сводные метрики -->
  <div class="report-summary-grid" id="reportSummaryGrid"></div>

  <div class="card">
    <div class="section-title">Отчёт реализации (вчера)</div>
    <div class="filters">
      <input class="filter-input" id="reportSearch" placeholder="Артикул / товар..." oninput="reportFilter()">
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th onclick="reportSort('seller_name')">КАБИНЕТ ↕</th>
          <th onclick="reportSort('nm_id')">АРТ WB ↕</th>
          <th onclick="reportSort('sa_name')">АРТ ПОСТАВЩИКА ↕</th>
          <th onclick="reportSort('subject_name')">ТОВАР ↕</th>
          <th onclick="reportSort('retail_amount')">ВЫРУЧКА ↕</th>
          <th onclick="reportSort('for_pay')">К ПЕРЕЧИСЛЕНИЮ ↕</th>
          <th onclick="reportSort('commission')">КОМИССИЯ WB ↕</th>
          <th onclick="reportSort('delivery')">ЛОГИСТИКА ↕</th>
          <th onclick="reportSort('storage')">ХРАНЕНИЕ ↕</th>
          <th onclick="reportSort('penalty')">ШТРАФЫ ↕</th>
        </tr></thead>
        <tbody id="reportBody"></tbody>
      </table>
    </div>
    <div class="pagination" id="reportPagination"></div>
  </div>
</div>

<script>
(function() {
  let data = [], filtered = [], page = 1;
  const PER = 50;
  let sortCol = 'for_pay', sortDir = -1;

  async function load() {
    try {
      const res = await fetch('/api/dashboard/sales-report-summary');
      data = await res.json();
      renderSummaryMetrics();
    } catch(e) { data = []; }
    reportFilter();
  }

  function renderSummaryMetrics() {
    const d = WB.cabinet ? data.filter(r => r.cabinet_id === WB.cabinet) : data;
    let retail=0, forPay=0, comm=0, del=0, stor=0, pen=0;
    for (const r of d) {
      retail += r.retail_amount || 0;
      forPay += r.for_pay      || 0;
      comm   += r.commission   || 0;
      del    += r.delivery     || 0;
      stor   += r.storage      || 0;
      pen    += r.penalty      || 0;
    }
    const grid = document.getElementById('reportSummaryGrid');
    if (!grid) return;
    grid.innerHTML = `
      <div class="report-metric"><div class="report-metric-label">ВЫРУЧКА</div><div class="report-metric-value">${fmtMoney(Math.round(retail))}</div></div>
      <div class="report-metric"><div class="report-metric-label">К ПЕРЕЧИСЛЕНИЮ</div><div class="report-metric-value positive">${fmtMoney(Math.round(forPay))}</div></div>
      <div class="report-metric"><div class="report-metric-label">КОМИССИЯ WB</div><div class="report-metric-value negative">${fmtMoney(Math.round(comm))}</div></div>
      <div class="report-metric"><div class="report-metric-label">ЛОГИСТИКА</div><div class="report-metric-value negative">${fmtMoney(Math.round(del))}</div></div>
      <div class="report-metric"><div class="report-metric-label">ХРАНЕНИЕ</div><div class="report-metric-value negative">${fmtMoney(Math.round(stor))}</div></div>
      <div class="report-metric"><div class="report-metric-label">ШТРАФЫ</div><div class="report-metric-value negative">${fmtMoney(Math.round(pen))}</div></div>
    `;
  }

  function reportFilter() {
    const search = (document.getElementById('reportSearch')?.value || '').toLowerCase();
    filtered = data.filter(r => {
      if (WB.cabinet && r.cabinet_id !== WB.cabinet) return false;
      if (search && !`${r.sa_name||''} ${r.subject_name||''} ${r.nm_id||''}`.toLowerCase().includes(search)) return false;
      return true;
    });
    sortData();
  }
  window.reportFilter = reportFilter;

  function reportSort(col) {
    if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = -1; }
    sortData();
  }
  window.reportSort = reportSort;

  function sortData() {
    filtered.sort((a, b) => {
      let va = a[sortCol] ?? 0, vb = b[sortCol] ?? 0;
      if (typeof va === 'string') return va.localeCompare(vb) * sortDir;
      return (va - vb) * sortDir;
    });
    page = 1;
    render();
  }

  function render() {
    const body = document.getElementById('reportBody');
    if (!body) return;
    const slice = filtered.slice((page-1)*PER, page*PER);

    if (!filtered.length) {
      body.innerHTML = `<tr><td colspan="10" style="text-align:center;color:var(--text3);padding:30px;font-family:'IBM Plex Mono',monospace;font-size:12px;">Нет данных — отчёт загружается в 10:30 МСК</td></tr>`;
      document.getElementById('reportPagination').innerHTML = '';
      return;
    }

    body.innerHTML = slice.map(r => `<tr class="fade-in">
      <td><span class="badge badge-orange">${r.seller_name || '—'}</span></td>
      <td class="td-mono">${r.nm_id || '—'}</td>
      <td>${r.sa_name || '—'}</td>
      <td>${r.subject_name || '—'}</td>
      <td class="td-mono">${fmtMoney(r.retail_amount)}</td>
      <td class="td-mono" style="color:var(--green)">${fmtMoney(r.for_pay)}</td>
      <td class="td-mono" style="color:var(--red)">${fmtMoney(r.commission)}</td>
      <td class="td-mono" style="color:var(--text2)">${fmtMoney(r.delivery)}</td>
      <td class="td-mono" style="color:var(--text2)">${fmtMoney(r.storage)}</td>
      <td class="td-mono" style="color:${r.penalty > 0 ? 'var(--red)' : 'var(--text3)'}">${fmtMoney(r.penalty)}</td>
    </tr>`).join('');

    renderPagination('reportPagination', filtered.length, PER, page, p => { page = p; render(); });
  }

  window.addEventListener('wb:tab-activated:report', load);
  window.addEventListener('wb:cabinet-changed', () => {
    renderSummaryMetrics();
    if (data.length) reportFilter();
  });
})();
</script>
