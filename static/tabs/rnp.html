<!-- TAB: РУКА НА ПУЛЬСЕ (РНП) v3 -->
<div id="rnpTab">
  <div id="rnpLoader" class="card section-mb" style="text-align:center;padding:40px;">
    <div style="display:inline-flex;align-items:center;gap:12px;color:var(--text2);font-size:14px;">
      <div style="display:flex;gap:4px;"><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div></div>
      <span>Расчёт данных РНП...</span>
    </div>
  </div>
  <div id="rnpError" class="card section-mb" style="display:none;padding:20px;border:1px solid var(--red);">
    <div style="color:var(--red);font-weight:600;">Ошибка</div>
    <div id="rnpErrorMsg" style="font-size:12px;color:var(--text2);margin-top:8px;white-space:pre-wrap;"></div>
  </div>
  <div id="rnpContent" style="display:none;">
    <!-- Сводка метрик -->
    <div class="card section-mb">
      <div class="section-title" id="rnpSummaryTitle">Сводка метрик</div>
      <div class="table-wrap" style="overflow-x:auto;">
        <table style="font-size:12px;">
          <thead id="rnpSummaryHead"></thead>
          <tbody id="rnpSummaryBody"></tbody>
        </table>
      </div>
    </div>

    <div class="card section-mb">
      <div class="filters" style="flex-wrap:wrap;gap:12px;align-items:center;">
        <label style="font-size:12px;color:var(--text2);">Месяц:</label>
        <input type="month" id="rnpMonth" class="filter-select" style="width:160px;">
        <label style="font-size:12px;color:var(--text2);">Сравнение:</label>
        <select id="rnpCompMode" class="filter-select">
          <option value="day">День к дню (пред. день)</option>
          <option value="week">Неделя к неделе (пред. неделя)</option>
        </select>
        <button class="filter-btn" onclick="rnpLoadMonth()">Обновить</button>
        <span id="rnpPeriodInfo" style="font-size:11px;color:var(--text3);margin-left:8px;"></span>
      </div>
    </div>

    <!-- Топ товары -->
    <div class="card section-mb">
      <div class="section-title">Динамика заказов по товарам</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
        <div>
          <div style="font-size:12px;color:var(--green);margin-bottom:6px;font-weight:600;">Лучшая динамика</div>
          <div class="table-wrap"><table><thead><tr><th>Артикул</th><th>Сумма</th><th>Дельта</th></tr></thead><tbody id="rnpTopProducts"></tbody></table></div>
        </div>
        <div>
          <div style="font-size:12px;color:var(--red);margin-bottom:6px;font-weight:600;">Худшая динамика</div>
          <div class="table-wrap"><table><thead><tr><th>Артикул</th><th>Сумма</th><th>Дельта</th></tr></thead><tbody id="rnpBottomProducts"></tbody></table></div>
        </div>
      </div>
    </div>

    <!-- Заказы (детализация: месяц / неделя / день) -->
    <div class="card section-mb">
      <div class="section-title" style="cursor:pointer;" onclick="toggleSection('rnpOrdersDetail')">📊 Заказы — расшифровка <span style="font-size:11px;color:var(--text3);">▼</span></div>
      <div id="rnpOrdersDetail" style="display:none;">
        <div class="table-wrap" style="overflow-x:auto;">
          <table style="font-size:12px;">
            <thead id="rnpOrdersHead"></thead>
            <tbody id="rnpOrdersBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Продажи (детализация) -->
    <div class="card section-mb">
      <div class="section-title" style="cursor:pointer;" onclick="toggleSection('rnpSalesDetail')">💰 Продажи (ЕФО) — расшифровка <span style="font-size:11px;color:var(--text3);">▼</span></div>
      <div id="rnpSalesDetail" style="display:none;">
        <div class="table-wrap" style="overflow-x:auto;">
          <table style="font-size:12px;">
            <thead id="rnpSalesHead"></thead>
            <tbody id="rnpSalesBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Относительные метрики -->
    <div class="card section-mb">
      <div class="section-title" style="cursor:pointer;" onclick="toggleSection('rnpRelativeDetail')">📐 Относительные метрики <span style="font-size:11px;color:var(--text3);">▼</span></div>
      <div id="rnpRelativeDetail" style="display:none;">
        <div class="table-wrap"><table><thead><tr><th>Метрика</th><th>Значение</th></tr></thead><tbody id="rnpRelativeBody"></tbody></table></div>
      </div>
    </div>

    <!-- P&L -->
    <div class="card section-mb">
      <div class="section-title">P&L (прогноз)</div>
      <div class="table-wrap"><table><thead><tr><th>Показатель</th><th>Сумма</th><th>% от продаж</th></tr></thead><tbody id="rnpPnlBody"></tbody></table></div>
    </div>

    <!-- Настройки -->
    <div class="card section-mb">
      <div class="section-title">Настройки</div>
      <div class="filters">
        <button class="filter-btn" onclick="rnpEditSettings()">Настройки</button>
        <button class="filter-btn" onclick="rnpEditCosts()">Себестоимость</button>
        <button class="filter-btn" onclick="rnpEditFixedExpenses()">Расходы</button>
        <button class="filter-btn" onclick="rnpEditPlans()">Планы</button>
      </div>
      <div id="rnpSettingsContent"></div>
    </div>
    <div class="card" id="rnpSettingsModal" style="display:none;">
      <div class="section-title" id="rnpModalTitle"></div>
      <div id="rnpModalContent"></div>
      <div class="filters" style="margin-top:15px;">
        <button class="filter-btn" onclick="rnpSaveModal()">Сохранить</button>
        <button class="filter-btn" onclick="rnpCloseModal()">Отмена</button>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  var rnpData = null;
  var currentModal = null;

  window.toggleSection = function(id) { var el = document.getElementById(id); if (el) el.style.display = el.style.display === 'none' ? '' : 'none'; };

  function F(v) {
    if (v === null || v === undefined) return '\u2014';
    if (typeof v === 'string') return v;
    return new Intl.NumberFormat('ru-RU').format(Math.round(v));
  }

  function P(v) {
    if (v === null || v === undefined) return '\u2014';
    if (typeof v === 'string') return v;
    return (Math.round(v * 10) / 10) + '%';
  }

  function dH(d) {
    if (!d) return '<td></td><td></td>';
    var v = d.delta || 0, p = d.delta_pct || 0;
    var sign = v > 0 ? '+' : '';
    var cls = v > 0 ? 'color:var(--green)' : v < 0 ? 'color:var(--red)' : '';
    return '<td style="' + cls + ';font-family:\'IBM Plex Mono\',monospace;font-size:11px;text-align:right;">' + sign + F(v) + '</td>' +
           '<td style="' + cls + ';font-family:\'IBM Plex Mono\',monospace;font-size:11px;text-align:right;">' + sign + p + '%</td>';
  }

  function showError(msg) { document.getElementById('rnpError').style.display=''; document.getElementById('rnpErrorMsg').textContent=msg; document.getElementById('rnpContent').style.display='none'; }

  window.rnpLoadMonth = async function() {
    var month = document.getElementById('rnpMonth').value;
    var mode = document.getElementById('rnpCompMode').value;
    var cab = window.WB ? WB.cabinet : '';
    if (!month) { showError('Выберите месяц'); return; }
    if (!cab) { showError('Кабинет не выбран'); return; }
    document.getElementById('rnpError').style.display='none';
    document.getElementById('rnpLoader').style.display='';
    document.getElementById('rnpContent').style.display='none';
    try {
      var res = await fetch('/api/rnp/calc-month?cabinet_id=' + encodeURIComponent(cab) + '&month=' + month + '&comparison_mode=' + mode);
      if (!res.ok) { var e = await res.text(); showError('HTTP ' + res.status); document.getElementById('rnpLoader').style.display='none'; return; }
      rnpData = await res.json();
    } catch(e) { showError('Ошибка сети: ' + e.message); document.getElementById('rnpLoader').style.display='none'; return; }
    document.getElementById('rnpLoader').style.display='none';
    if (!rnpData || !rnpData.totals) { showError('Нет данных'); return; }
    document.getElementById('rnpContent').style.display='';
    try { rnpRenderMonth(); } catch(e) { showError('Ошибка: ' + e.message); console.error(e); }
  };

  function rnpRenderMonth() {
    renderSummary(); renderTopProducts(); renderBottomProducts();
    renderOrdersDetail(); renderSalesDetail(); renderRelative(); renderPnl(); renderSettings();
    var pp = rnpData.comparison_period || {};
    document.getElementById('rnpPeriodInfo').textContent = rnpData.month + ' | Сравнение: ' + (pp.start||'—') + ' — ' + (pp.end||'—') + ' | Дней: ' + rnpData.daily.length;
    document.getElementById('rnpSummaryTitle').textContent = 'Сводка метрик за ' + rnpData.month;
  }

  function renderSummary() {
    var s = rnpData.summary;
    var thCols = '';
    for (var b = 0; b < 3; b++) {
      if (b > 0) thCols += '<th style="width:4px;background:transparent;border:none;"></th>';
      thCols += '<th style="min-width:130px;">Показатель</th><th style="text-align:right;min-width:75px;">Факт</th><th style="text-align:right;min-width:60px;">Δ</th><th style="text-align:right;min-width:50px;">Δ%</th>';
    }
    document.getElementById('rnpSummaryHead').innerHTML = '<tr>' + thCols + '</tr>';
    var b1 = [
      ['orders_amount','Заказы, сумм (до СПП)',0],
      ['orders_count','Заказы, шт',0],
      ['avg_check','Средний чек',0],
      ['spp_pct','СПП',1],
      ['sales_amount','Продажи (прогноз выкупа)',0],
      ['sales_count','Продажи, шт',0],
      ['buyout_pct','% выкупа',1],
      ['return_amount','Возвраты, сумм',0],
      ['return_count','Возвраты, шт',0]
    ];
    var b2 = [
      ['cost_of_goods','Себестоимость',0],
      ['commission','Комиссия',0],
      ['delivery','Логистика',0],
      ['storage','Хранение',0],
      ['acceptance','Платная приемка',0],
      ['ad_spend','Рекламный бюджет',0],
      ['promotion','Продвижение',0],
      ['penalties','Штрафы',0],
      ['wb_expenses','Итого расходы WB',0]
    ];
    var b3 = [
      ['gross_margin','Валовая маржа',0],
      ['taxes','Налоги (УСН + НДС)',0],
      ['net_profit','Чистая прибыль',0],
      ['profitability','Рентабельность',2],
      ['to_supplier','К перечислению продавцу',0],
      ['to_rs','К перечислению на РС',0]
    ];
    var maxLen = Math.max(b1.length, b2.length, b3.length);
    var html = '';
    for (var i = 0; i < maxLen; i++) {
      html += '<tr>';
      var blocks = [b1, b2, b3];
      for (var b = 0; b < 3; b++) {
        if (b > 0) html += '<td style="width:4px;background:transparent;border:none;"></td>';
        var m = blocks[b][i];
        if (!m) { html += '<td colspan="4"></td>'; continue; }
        var key = m[0], label = m[1], type = m[2];
        var d = s[key] || {value:0, delta:0, delta_pct:0};
        var val = type === 2 ? (Math.round(d.value * 10) / 10) + '%' : type === 1 ? (Math.round(d.value * 10) / 10) + '%' : F(d.value);
        html += '<td style="font-weight:600;white-space:nowrap;">' + label + '</td>';
        html += '<td style="font-family:\'IBM Plex Mono\',monospace;text-align:right;font-weight:500;">' + val + '</td>';
        html += dH(d);
      }
      html += '</tr>';
    }
    document.getElementById('rnpSummaryBody').innerHTML = html;
  }

  function renderTopProducts() {
    var items = rnpData.top_products || [];
    var h = '';
    for (var i = 0; i < items.length; i++) {
      var p = items[i];
      h += '<tr><td style="font-size:11px;">'+p.article+'</td><td style="font-family:\'IBM Plex Mono\',monospace;">'+F(p.current)+'</td><td style="color:var(--green);font-family:\'IBM Plex Mono\',monospace;">+'+F(p.delta)+'</td></tr>';
    }
    document.getElementById('rnpTopProducts').innerHTML = h || '<tr><td colspan="3">\u2014</td></tr>';
  }

  function renderBottomProducts() {
    var items = rnpData.bottom_products || [];
    var h = '';
    for (var i = 0; i < items.length; i++) {
      var p = items[i];
      h += '<tr><td style="font-size:11px;">'+p.article+'</td><td style="font-family:\'IBM Plex Mono\',monospace;">'+F(p.current)+'</td><td style="color:var(--red);font-family:\'IBM Plex Mono\',monospace;">'+F(p.delta)+'</td></tr>';
    }
    document.getElementById('rnpBottomProducts').innerHTML = h || '<tr><td colspan="3">\u2014</td></tr>';
  }

  function dr(label, fact, planVal, weekVals, dayVals) {
    var fv = F(fact);
    var pv = '', pct = '';
    if (planVal !== undefined && planVal !== null && planVal !== 0) {
      pv = F(planVal);
      if (typeof fact === 'number' && typeof planVal === 'number' && planVal !== 0) pct = ((fact / planVal) * 100).toFixed(1) + '%';
    }
    var h = '<tr><td style="white-space:nowrap;">' + label + '</td>';
    h += '<td style="font-family:\'IBM Plex Mono\',monospace;text-align:right;">' + fv + '</td>';
    h += '<td style="font-family:\'IBM Plex Mono\',monospace;text-align:right;">' + pv + '</td>';
    h += '<td style="text-align:right;">' + pct + '</td>';
    for (var i = 0; i < weekVals.length; i++) {
      h += '<td style="font-family:\'IBM Plex Mono\',monospace;text-align:right;font-size:11px;">' + F(weekVals[i]) + '</td>';
    }
    for (var i = 0; i < dayVals.length; i++) {
      h += '<td style="font-family:\'IBM Plex Mono\',monospace;text-align:right;font-size:11px;">' + F(dayVals[i]) + '</td>';
    }
    h += '</tr>';
    return h;
  }

  function buildDetailHeader(daily, weekly) {
    var h = '<tr><th style="min-width:180px;">Показатель</th><th style="text-align:right;">Месяц</th><th style="text-align:right;">План</th><th style="text-align:right;">%</th>';
    for (var i = weekly.length - 1; i >= 0; i--) {
      var si = i * 7, ei = Math.min(si + 6, daily.length - 1);
      var sd = daily[si] ? daily[si].date.substring(8, 10) : '';
      var ed = daily[ei] ? daily[ei].date.substring(8, 10) : '';
      h += '<th style="text-align:right;font-size:10px;white-space:nowrap;">' + sd + '\u2013' + ed + '</th>';
    }
    for (var i = daily.length - 1; i >= 0; i--) {
      h += '<th style="text-align:right;font-size:10px;">' + daily[i].date.substring(8, 10) + '</th>';
    }
    h += '</tr>';
    return h;
  }

  function renderOrdersDetail() {
    var t = rnpData.totals, p = rnpData.plan || {};
    var daily = rnpData.daily || [], weekly = rnpData.weekly || [];
    document.getElementById('rnpOrdersHead').innerHTML = buildDetailHeader(daily, weekly);
    var wA=function(i){return weekly[i]?weekly[i].orders_amount:undefined;};
    var dA=function(i){return daily[i]?daily[i].order_sum:undefined;};
    var wC=function(i){return weekly[i]?weekly[i].orders_count:undefined;};
    var dC=function(i){return daily[i]?daily[i].order_count:undefined;};
    var wAC=function(i){return weekly[i]?weekly[i].avg_check_orders:undefined;};
    var dAC=function(i){return daily[i]?daily[i].avg_check_orders:undefined;};
    var wS=function(i){return weekly[i]?weekly[i].spp_pct:undefined;};
    var dS=function(i){return daily[i]?daily[i].spp_pct:undefined;};
    var wAd=function(i){return weekly[i]?weekly[i].ad_spend:undefined;};
    var dAd=function(i){return daily[i]?daily[i].ad_spend:undefined;};
    var wDRR=function(i){return weekly[i]?weekly[i].drr:undefined;};
    var dDRR=function(i){return daily[i]?daily[i].drr:undefined;};
    var wSA=function(i){return weekly[i]?weekly[i].sales_amount:undefined;};
    var dSA=function(i){return daily[i]?daily[i].sales_amount:undefined;};
    var wBE=function(i){return weekly[i]?(weekly[i].wb_expenses_total||0):undefined;};
    var dBE=function(i){return daily[i]?daily[i].wb_expenses_total:undefined;};
    var wD=function(i){return weekly[i]?weekly[i].delivery:undefined;};
    var dD=function(i){return daily[i]?daily[i].delivery:undefined;};
    var wCo=function(i){return weekly[i]?weekly[i].commission:undefined;};
    var dCo=function(i){return daily[i]?daily[i].commission:undefined;};
    var wSt=function(i){return weekly[i]?weekly[i].storage:undefined;};
    var dSt=function(i){return daily[i]?daily[i].storage:undefined;};
    var wAc=function(i){return weekly[i]?weekly[i].acceptance:undefined;};
    var dAc=function(i){return daily[i]?daily[i].acceptance:undefined;};
    var wP=function(i){return weekly[i]?weekly[i].promotion:undefined;};
    var dP=function(i){return daily[i]?daily[i].promotion:undefined;};
    var wPe=function(i){return weekly[i]?weekly[i].penalties:undefined;};
    var dPe=function(i){return daily[i]?daily[i].penalties:undefined;};
    var wCG=function(i){return weekly[i]?weekly[i].cost_of_goods:undefined;};
    var dCG=function(i){return daily[i]?daily[i].cost_of_goods:undefined;};
    var wa=[],da=[],wc=[],dc=[],wac=[],dac=[],ws=[],ds=[],wad=[],dad=[],wdr=[],ddr=[],wsa=[],dsa=[],wbe=[],dbe=[],wd=[],dd=[],wco=[],dco=[],wst=[],dst=[],wac2=[],dac2=[],wp=[],dp=[],wpe=[],dpe=[],wcg=[],dcg=[];
    for(var i=weekly.length-1;i>=0;i--){wa.push(wA(i));wc.push(wC(i));wac.push(wAC(i));ws.push(wS(i));wad.push(wAd(i));wdr.push(wDRR(i));wsa.push(wSA(i));wbe.push(wBE(i));wd.push(wD(i));wco.push(wCo(i));wst.push(wSt(i));wac2.push(wAc(i));wp.push(wP(i));wpe.push(wPe(i));wcg.push(wCG(i));}
    for(var i=daily.length-1;i>=0;i--){da.push(dA(i));dc.push(dC(i));dac.push(dAC(i));ds.push(dS(i));dad.push(dAd(i));ddr.push(dDRR(i));dsa.push(dSA(i));dbe.push(dBE(i));dd.push(dD(i));dco.push(dCo(i));dst.push(dSt(i));dac2.push(dAc(i));dp.push(dP(i));dpe.push(dPe(i));dcg.push(dCG(i));}
    var h = '';
    h += dr('Заказы, сумм (до СПП)', t.orders_amount, p.orders_amount, wa, da);
    h += dr('Заказы, шт', t.orders_count, p.orders_count, wc, dc);
    h += dr('Средний чек, заказы', t.avg_check_orders, p.avg_price, wac, dac);
    h += dr('СПП', P(t.spp_pct), null, ws.map(function(v){return v!=null?P(v):null;}), ds.map(function(v){return v!=null?P(v):null;}));
    h += dr('Рекламный бюджет', t.ad_spend, null, wad, dad);
    h += dr('ДРР по заказам', P(t.drr), p.drr?P(p.drr*100):null, wdr.map(function(v){return v!=null?P(v):null;}), ddr.map(function(v){return v!=null?P(v):null;}));
    h += dr('Прогноз выкупа, сумм', t.sales_amount, p.sales_minus_returns, wsa, dsa);
    h += dr('Прямые расходы площадки', -t.wb_expenses_total, null, wbe.map(function(v){return v!=null?-v:undefined;}), dbe.map(function(v){return v!=null?-v:undefined;}));
    h += dr('Логистика', -t.delivery, p.logistics?-p.logistics:null, wd.map(function(v){return v!=null?-v:undefined;}), dd.map(function(v){return v!=null?-v:undefined;}));
    h += dr('Комиссия', -t.commission, p.commission?-p.commission:null, wco.map(function(v){return v!=null?-v:undefined;}), dco.map(function(v){return v!=null?-v:undefined;}));
    h += dr('Хранение', -t.storage, p.storage?-p.storage:null, wst.map(function(v){return v!=null?-v:undefined;}), dst.map(function(v){return v!=null?-v:undefined;}));
    h += dr('Платная приемка', -t.acceptance, null, wac2.map(function(v){return v!=null?-v:undefined;}), dac2.map(function(v){return v!=null?-v:undefined;}));
    h += dr('Продвижение', -t.promotion, null, wp.map(function(v){return v!=null?-v:undefined;}), dp.map(function(v){return v!=null?-v:undefined;}));
    h += dr('Штрафы', -t.penalties, null, wpe.map(function(v){return v!=null?-v:undefined;}), dpe.map(function(v){return v!=null?-v:undefined;}));
    h += dr('Себестоимость', -t.cost_of_goods, p.cost_of_goods?-p.cost_of_goods:null, wcg.map(function(v){return v!=null?-v:undefined;}), dcg.map(function(v){return v!=null?-v:undefined;}));
    document.getElementById('rnpOrdersBody').innerHTML = h;
  }

  function renderSalesDetail() {
    var t = rnpData.totals, p = rnpData.plan || {};
    var daily = rnpData.daily || [], weekly = rnpData.weekly || [];
    document.getElementById('rnpSalesHead').innerHTML = buildDetailHeader(daily, weekly);
    var wA=function(i){return weekly[i]?weekly[i].orders_amount:undefined;};
    var dA=function(i){return daily[i]?daily[i].order_sum:undefined;};
    var wSC=function(i){return weekly[i]?weekly[i].sales_count:undefined;};
    var dSC=function(i){return daily[i]?daily[i].sales_count:undefined;};
    var wACS=function(i){return weekly[i]?weekly[i].avg_check_sales:undefined;};
    var dACS=function(i){return daily[i]?daily[i].avg_check_sales:undefined;};
    var wOC=function(i){return weekly[i]?weekly[i].order_cancel:undefined;};
    var dOC=function(i){return daily[i]?daily[i].order_cancel:undefined;};
    var wBP=function(i){return weekly[i]?weekly[i].buyout_pct:undefined;};
    var dBP=function(i){return daily[i]?daily[i].buyout_pct:undefined;};
    var wRA=function(i){return weekly[i]?weekly[i].return_amount:undefined;};
    var dRA=function(i){return daily[i]?daily[i].return_amount:undefined;};
    var wRC=function(i){return weekly[i]?weekly[i].return_count:undefined;};
    var dRC=function(i){return daily[i]?daily[i].return_count:undefined;};
    var wTS=function(i){return weekly[i]?weekly[i].to_supplier:undefined;};
    var dTS=function(i){return daily[i]?daily[i].to_supplier:undefined;};
    var wD=function(i){return weekly[i]?weekly[i].delivery:undefined;};
    var dD=function(i){return daily[i]?daily[i].delivery:undefined;};
    var wCo=function(i){return weekly[i]?weekly[i].commission:undefined;};
    var dCo=function(i){return daily[i]?daily[i].commission:undefined;};
    var wSt=function(i){return weekly[i]?weekly[i].storage:undefined;};
    var dSt=function(i){return daily[i]?daily[i].storage:undefined;};
    var wAc=function(i){return weekly[i]?weekly[i].acceptance:undefined;};
    var dAc=function(i){return daily[i]?daily[i].acceptance:undefined;};
    var wPr=function(i){return weekly[i]?weekly[i].promotion:undefined;};
    var dPr=function(i){return daily[i]?daily[i].promotion:undefined;};
    var wPe=function(i){return weekly[i]?weekly[i].penalties:undefined;};
    var dPe=function(i){return daily[i]?daily[i].penalties:undefined;};
    var wCG=function(i){return weekly[i]?weekly[i].cost_of_goods:undefined;};
    var dCG=function(i){return daily[i]?daily[i].cost_of_goods:undefined;};
    var wU=function(i){return weekly[i]?weekly[i].usn:undefined;};
    var dU=function(i){return daily[i]?daily[i].usn:undefined;};
    var wN=function(i){return weekly[i]?weekly[i].nds:undefined;};
    var dN=function(i){return daily[i]?daily[i].nds:undefined;};
    var wRS=function(i){return weekly[i]?weekly[i].to_rs:undefined;};
    var dRS=function(i){return daily[i]?daily[i].to_rs:undefined;};
    var wSA=function(i){return weekly[i]?weekly[i].sales_amount:undefined;};
    var dSA=function(i){return daily[i]?daily[i].sales_amount:undefined;};
    var wNP=function(i){return weekly[i]?weekly[i].net_profit:undefined;};
    var dNP=function(i){return daily[i]?daily[i].net_profit:undefined;};
    var wPR=function(i){return weekly[i]?weekly[i].profitability:undefined;};
    var dPR=function(i){return daily[i]?daily[i].profitability:undefined;};
    var wa=[],da=[],wsc=[],dsc=[],wacs=[],dacs=[],woc=[],doc=[],wbp=[],dbp=[],wra=[],dra=[],wrc=[],drc=[],wts=[],dts=[],wd=[],dd=[],wco=[],dco=[],wst=[],dst=[],wac=[],dac=[],wpr=[],dpr=[],wpe=[],dpe=[],wcg=[],dcg=[],wu=[],du=[],wn=[],dn=[],wrs=[],drs=[],wsa=[],dsa=[],wnp=[],dnp=[],wpr2=[],dpr2=[];
    for(var i=weekly.length-1;i>=0;i--){wa.push(wA(i));wsc.push(wSC(i));wacs.push(wACS(i));woc.push(wOC(i));wbp.push(wBP(i));wra.push(wRA(i));wrc.push(wRC(i));wts.push(wTS(i));wd.push(wD(i));wco.push(wCo(i));wst.push(wSt(i));wac.push(wAc(i));wpr.push(wPr(i));wpe.push(wPe(i));wcg.push(wCG(i));wu.push(wU(i));wn.push(wN(i));wrs.push(wRS(i));wsa.push(wSA(i));wnp.push(wNP(i));wpr2.push(wPR(i));}
    for(var i=daily.length-1;i>=0;i--){da.push(dA(i));dsc.push(dSC(i));dacs.push(dACS(i));doc.push(dOC(i));dbp.push(dBP(i));dra.push(dRA(i));drc.push(dRC(i));dts.push(dTS(i));dd.push(dD(i));dco.push(dCo(i));dst.push(dSt(i));dac.push(dAc(i));dpr.push(dPr(i));dpe.push(dPe(i));dcg.push(dCG(i));du.push(dU(i));dn.push(dN(i));drs.push(dRS(i));dsa.push(dSA(i));dnp.push(dNP(i));dpr2.push(dPR(i));}
    var h = '';
    h += dr('Продажи, сумм', t.orders_amount, p.orders_amount, wa, da);
    h += dr('Продажи, шт', t.sales_count, p.sales_count, wsc, dsc);
    h += dr('Средний чек, продажи', t.avg_check_sales, null, wacs, dacs);
    h += dr('Отказы, шт', t.refusal_count, null, woc, doc);
    h += dr('% выкупа', P(t.buyout_pct), null, wbp.map(function(v){return v!=null?P(v):null;}), dbp.map(function(v){return v!=null?P(v):null;}));
    h += dr('Возвраты, сумм', t.return_amount, null, wra, dra);
    h += dr('Возвраты, шт', t.return_count, p.returns_count, wrc, drc);
    h += dr('К перечислению продавцу', t.to_supplier, null, wts, dts);
    h += dr('Логистика', t.delivery, null, wd, dd);
    h += dr('Комиссия', t.commission, null, wco, dco);
    h += dr('Хранение', t.storage, null, wst, dst);
    h += dr('Платная приемка', t.acceptance, null, wac, dac);
    h += dr('Продвижение', t.promotion, null, wpr, dpr);
    h += dr('Штрафы', t.penalties, null, wpe, dpe);
    h += dr('Себестоимость', t.cost_of_goods, null, wcg, dcg);
    var wgm=[],dgm=[];
    for(var i=0;i<weekly.length;i++){var ww=weekly[i];wgm.push(ww?(ww.sales_amount-ww.wb_expenses_total-ww.cost_of_goods):undefined);}
    for(var i=0;i<daily.length;i++){var dd2=daily[i];dgm.push(dd2?(dd2.sales_amount-dd2.wb_expenses_total-dd2.cost_of_goods):undefined);}
    h += dr('Валовая маржа', t.sales_amount-t.wb_expenses_total-t.cost_of_goods, null, wgm, dgm);
    h += dr('Налоги', t.usn+t.nds, null, wu.map(function(v,i){return v!=null?v+(wn[i]||0):undefined;}), du.map(function(v,i){return v!=null?v+(dn[i]||0):undefined;}));
    h += dr('УСН', t.usn, null, wu, du);
    h += dr('НДС (невозвратный)', t.nds, null, wn, dn);
    h += dr('К перечислению на РС', t.to_rs, null, wrs, drs);
    h += dr('Рентабельность', P(t.profitability), null, wpr2.map(function(v){return v!=null?P(v):null;}), dpr2.map(function(v){return v!=null?P(v):null;}));
    h += dr('Чистая прибыль', t.net_profit, null, wnp, dnp);
    document.getElementById('rnpSalesBody').innerHTML = h;
  }

  function renderRelative() {
    var m = rnpData.relative;
    var r1=function(v){return typeof v==='number'?(Math.round(v*10)/10)+'%':v;};
    var rows = [['Наценка',m.markup],['Логистика на единицу',m.logistics_per_unit],['Себестоимость на единицу',m.cost_per_unit],['Продвижение на единицу',m.promotion_per_unit],['Хранение на единицу',m.storage_per_unit],['Чистая прибыль на единицу',m.net_profit_per_unit],['Расходы площадки от продаж',r1(m.platform_pct)],['Комиссия с продаж',r1(m.commission_pct)],['Логистика от продаж',r1(m.logistics_pct)],['Продвижение от продаж',r1(m.promotion_pct)],['Хранение от продаж',r1(m.storage_pct)],['Платная приемка от продаж',r1(m.acceptance_pct)],['Себестоимость от продаж',r1(m.cost_pct)],['Налоги от продаж',r1(m.taxes_pct)]];
    var h = '';
    for (var i = 0; i < rows.length; i++) h += '<tr><td>'+rows[i][0]+'</td><td style="font-family:\'IBM Plex Mono\',monospace;">'+(typeof rows[i][1]==='number'?F(rows[i][1]):rows[i][1])+'</td></tr>';
    document.getElementById('rnpRelativeBody').innerHTML = h;
  }

  function renderPnl() {
    var t = rnpData.totals, sa = t.sales_amount||1;
    var gross = t.sales_amount - t.wb_expenses_total - t.cost_of_goods;
    var net = t.net_profit, tx = t.usn + t.nds;
    var rows = [['Прогноз выкупа',t.sales_amount],['WB Расходы',-t.wb_expenses_total],['Себестоимость',-t.cost_of_goods],['Валовая маржа',gross],['EBITDA',gross],['Налоги',-tx],['Чистая прибыль',net]];
    var h = '';
    for (var i = 0; i < rows.length; i++) h += '<tr><td>'+rows[i][0]+'</td><td style="font-family:\'IBM Plex Mono\',monospace;text-align:center;">'+F(rows[i][1])+'</td><td style="text-align:center;">'+((rows[i][1]/sa)*100).toFixed(1)+'%</td></tr>';
    document.getElementById('rnpPnlBody').innerHTML = h;
  }

  function renderSettings() {
    var s = rnpData.settings;
    document.getElementById('rnpSettingsContent').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;"><div><strong>УСН:</strong> '+(s.usn_rate*100).toFixed(0)+'%</div><div><strong>НДС:</strong> '+(s.nds_rate*100).toFixed(0)+'%</div><div><strong>USD:</strong> '+s.usd_rate+'</div><div><strong>CNY:</strong> '+s.cny_rate+'</div></div>';
  }

  window.rnpEditSettings=function(){currentModal='settings';document.getElementById('rnpModalTitle').textContent='Настройки';var s=rnpData.settings;document.getElementById('rnpModalContent').innerHTML='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;"><label>УСН: <input id="mUsnRate" type="number" step="0.01" value="'+s.usn_rate+'"></label><label>НДС: <input id="mNdsRate" type="number" step="0.01" value="'+s.nds_rate+'"></label><label>USD: <input id="mUsdRate" type="number" step="0.01" value="'+s.usd_rate+'"></label><label>CNY: <input id="mCnyRate" type="number" step="0.01" value="'+s.cny_rate+'"></label></div>';document.getElementById('rnpSettingsModal').style.display='block';};
  window.rnpEditCosts=async function(){currentModal='costs';document.getElementById('rnpModalTitle').textContent='Себестоимость';try{var r=await fetch('/api/rnp/costs?cabinet_id='+WB.cabinet);var c=await r.json();var h='<div id="rnpCostsList">';for(var i=0;i<c.length;i++)h+='<div style="display:flex;gap:5px;margin:3px 0;"><input value="'+(c[i].supplier_article||'')+'" style="flex:1;"><input type="number" value="'+c[i].cost_rub+'" style="width:100px;"><button onclick="this.parentElement.remove()">\u2715</button></div>';h+='</div><button onclick="document.getElementById(\'rnpCostsList\').insertAdjacentHTML(\'beforeend\',\'<div style=&quot;display:flex;gap:5px;margin:3px 0;&quot;><input style=&quot;flex:1;&quot;><input type=&quot;number&quot; style=&quot;width:100px;&quot;><button onclick=&quot;this.parentElement.remove()&quot;>\u2715</div>\')">\u0414\u043e\u0431\u0430\u0432\u0438\u0442\u044c</button>';document.getElementById('rnpModalContent').innerHTML=h;}catch(e){}document.getElementById('rnpSettingsModal').style.display='block';};
  window.rnpEditFixedExpenses=async function(){currentModal='fixed';document.getElementById('rnpModalTitle').textContent='Расходы';try{var r=await fetch('/api/rnp/fixed-expenses?cabinet_id='+WB.cabinet);var c=await r.json();var h='<div id="rnpFixedList">';for(var i=0;i<c.length;i++)h+='<div style="display:flex;gap:5px;margin:3px 0;"><input value="'+(c[i].name||'')+'" style="flex:1;"><input type="number" value="'+c[i].amount_monthly+'" style="width:120px;"><button onclick="this.parentElement.remove()">\u2715</button></div>';h+='</div><button onclick="document.getElementById(\'rnpFixedList\').insertAdjacentHTML(\'beforeend\',\'<div style=&quot;display:flex;gap:5px;margin:3px 0;&quot;><input style=&quot;flex:1;&quot;><input type=&quot;number&quot; style=&quot;width:120px;&quot;><button onclick=&quot;this.parentElement.remove()&quot;>\u2715</div>\')">\u0414\u043e\u0431\u0430\u0432\u0438\u0442\u044c</button>';document.getElementById('rnpModalContent').innerHTML=h;}catch(e){}document.getElementById('rnpSettingsModal').style.display='block';};
  window.rnpEditPlans=async function(){currentModal='plans';document.getElementById('rnpModalTitle').textContent='Планы';try{var r=await fetch('/api/rnp/plans?cabinet_id='+WB.cabinet);var c=await r.json();var h='<div id="rnpPlansList">';for(var i=0;i<c.length;i++)h+='<div style="display:flex;gap:5px;margin:3px 0;"><input type="month" value="'+c[i].month.substring(0,7)+'" style="width:140px;"><input type="number" value="'+c[i].orders_amount+'" style="width:120px;"><input type="number" value="'+c[i].orders_count+'" style="width:100px;"><input type="number" value="'+c[i].sales_minus_returns+'" style="width:120px;"><button onclick="this.parentElement.remove()">\u2715</button></div>';h+='</div>';document.getElementById('rnpModalContent').innerHTML=h;}catch(e){}document.getElementById('rnpSettingsModal').style.display='block';};

  window.rnpSaveModal=async function(){
    if(currentModal==='settings'){await fetch('/api/rnp/settings?cabinet_id='+WB.cabinet,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({usn_rate:parseFloat(document.getElementById('mUsnRate').value),nds_rate:parseFloat(document.getElementById('mNdsRate').value),usd_rate:parseFloat(document.getElementById('mUsdRate').value),cny_rate:parseFloat(document.getElementById('mCnyRate').value)})});}
    else if(currentModal==='costs'){var it=[];document.querySelectorAll('#rnpCostsList>div').forEach(function(el){var inp=el.querySelectorAll('input');if(inp[0].value)it.push({supplier_article:inp[0].value,cost_rub:parseFloat(inp[1].value)||0});});await fetch('/api/rnp/costs?cabinet_id='+WB.cabinet,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(it)});}
    else if(currentModal==='fixed'){var it=[];document.querySelectorAll('#rnpFixedList>div').forEach(function(el){var inp=el.querySelectorAll('input');if(inp[0].value)it.push({name:inp[0].value,amount_monthly:parseFloat(inp[1].value)||0});});await fetch('/api/rnp/fixed-expenses?cabinet_id='+WB.cabinet,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(it)});}
    rnpCloseModal();rnpLoadMonth();
  };
  window.rnpCloseModal=function(){document.getElementById('rnpSettingsModal').style.display='none';currentModal=null;};

  function initMonth(){var inp=document.getElementById('rnpMonth');if(inp&&!inp.value){var n=new Date();inp.value=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');}}
  window.addEventListener('wb:tab-activated:rnp',function(){initMonth();rnpLoadMonth();});
  window.addEventListener('wb:cabinet-changed',function(){try{if(typeof loadedTabs!=='undefined'&&loadedTabs.has('rnp'))rnpLoadMonth();}catch(e){}});
})();
</script>
